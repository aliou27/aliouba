name: Clean section labels

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove section numbers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          for a, b in {
              '01 / Results': 'Results',
              '02 / About': 'About',
              '03 / Selected work': 'Selected work',
              '04 / Labs & experiments': 'Labs & experiments',
              '05 / Writing & education': 'Writing & education',
              '06 / Experience': 'Experience',
              '07 / Contact': 'Contact',
          }.items(): s = s.replace(a, b)
          p.write_text(s)
          p = Path('js/main.js')
          s = p.read_text()
          for a, b in {
              "'sections.proof':'01 / Résultats'": "'sections.proof':'Résultats'",
              "'sections.about':'02 / À propos'": "'sections.about':'À propos'",
              "'sections.projects':'03 / Projets sélectionnés'": "'sections.projects':'Projets sélectionnés'",
              "'sections.labs':'04 / Labs & expériences'": "'sections.labs':'Labs & expériences'",
              "'sections.writing':'05 / Écriture & éducation'": "'sections.writing':'Écriture & éducation'",
              "'sections.experience':'06 / Expérience'": "'sections.experience':'Expérience'",
              "'sections.contact':'07 / Contact'": "'sections.contact':'Contact'",
          }.items(): s = s.replace(a, b)
          p.write_text(s)
          PY
          rm .github/workflows/clean-section-labels.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/main.js .github/workflows/clean-section-labels.yml
          git commit -m 'Remove section numbers from portfolio headings'
          git push
