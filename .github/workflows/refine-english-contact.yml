name: Refine English You Need contact

on:
  push:
    branches: [main]

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refine contact presentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('english-services.html')
          s = p.read_text()

          s = s.replace(
              'The English You Need vous aide à faire le passage entre comprendre l’anglais et l’utiliser réellement.',
              '<strong>The English You Need</strong> vous aide à faire le passage entre comprendre l’anglais et l’utiliser réellement.'
          )
          s = s.replace(
              'The English You Need helps you make the transition from understanding English to actually using it.',
              '<strong>The English You Need</strong> helps you make the transition from understanding English to actually using it.'
          )

          s = s.replace(
              '<h2 data-i18n="contactTitle">Prêt à mieux utiliser votre anglais ?</h2>',
              '<h2 data-i18n="contactTitle">Prêt à rejoindre The English You Need ?</h2>'
          )
          s = s.replace(
              'contactTitle:\'Ready to use English better?\'',
              'contactTitle:\'Ready to join The English You Need?\''
          )
          s = s.replace(
              'contactTitle:\'Prêt à mieux utiliser votre anglais ?\'',
              'contactTitle:\'Prêt à rejoindre The English You Need ?\''
          )

          old = re.compile(r'<div class="contact-links">.*?</div>', re.S)
          new = '''<div class="contact-links" aria-label="Contact">
<a class="contact-link" href="https://wa.me/221764222210" target="_blank" rel="noreferrer" aria-label="WhatsApp">
<svg class="contact-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.52 3.48A11.78 11.78 0 0 0 12.12 0C5.61 0 .32 5.29.32 11.8c0 2.08.54 4.11 1.57 5.9L.22 24l6.48-1.64a11.78 11.78 0 0 0 5.42 1.3h.01c6.51 0 11.8-5.29 11.8-11.8 0-3.15-1.23-6.11-3.41-8.38ZM12.13 21.65h-.01a9.84 9.84 0 0 1-5.02-1.37l-.36-.21-3.85.98 1.03-3.75-.23-.39a9.84 9.84 0 1 1 8.44 4.74Zm5.41-7.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.25-.46-2.38-1.46-.88-.78-1.47-1.74-1.64-2.03-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.03 1-1.03 2.45s1.05 2.84 1.2 3.03c.15.2 2.07 3.16 5.01 4.43.7.3 1.25.48 1.67.62.7.22 1.34.19 1.84.11.56-.08 1.76-.72 2.01-1.42.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35Z"/></svg>
<span>WhatsApp</span>
</a>
<a class="contact-link" href="mailto:misteraliouba@gmail.com" aria-label="Email">
<svg class="contact-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm0 2v.51l9 5.62 9-5.62V7H3Zm18 10V9.86l-8.47 5.3a1 1 0 0 1-1.06 0L3 9.86V17h18Z"/></svg>
<span>misteraliouba@gmail.com</span>
</a>
</div>'''
          s, n = old.subn(new, s, count=1)
          if n != 1:
              raise SystemExit('contact block not found')

          style = '''\n<style id="english-contact-refinement">\n.english-page .contact-links{display:flex;align-items:center;gap:28px;flex-wrap:wrap;margin-top:26px}\n.english-page .contact-link{display:inline-flex;align-items:center;gap:8px;color:var(--text);text-decoration:none;font-weight:500;font-size:.9rem}\n.english-page .contact-link:hover{color:var(--blue)}\n.english-page .contact-icon{width:17px;height:17px;fill:currentColor;flex:0 0 17px}\n</style>\n'''
          s = s.replace('</head>', style + '</head>', 1)

          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add english-services.html
          git commit -m "Refine English You Need contact presentation" || exit 0
          git push
          rm .github/workflows/refine-english-contact.yml
          git add .github/workflows/refine-english-contact.yml
          git commit -m "Remove temporary refinement workflow" || true
          git push || true
